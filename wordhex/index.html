<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WordHex</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0f181c; }
      body { display: flex; align-items: center; justify-content: center; }
      #unity-container {
        position: relative;
        width: min(100vw, 56.25vh);
        width: min(100vw, 56.25dvh);
        aspect-ratio: 9 / 16;
      }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #231F20; outline: none; }
      #unity-progress { position: absolute; left: 20%; top: 50%; width: 60%; accent-color: #bca467; }
      #unity-error { position: absolute; inset: 0; padding: 16px; color: white; background: #0f181c; font: 14px sans-serif; overflow: auto; }
    </style>
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" width="540" height="960" tabindex="-1" aria-label="WordHex"></canvas>
      <progress id="unity-progress" max="1" value="0" aria-label="Loading"></progress>
      <div id="unity-error" role="alert" hidden></div>
    </main>
    <script>
      const canvas = document.querySelector('#unity-canvas');
      const progress = document.querySelector('#unity-progress');
      const error = document.querySelector('#unity-error');
      function showError(message) {
        progress.hidden = true;
        error.textContent = message;
        error.hidden = false;
      }
      const config = {
        arguments: [],
        dataUrl: 'Build/wordhex.data.unityweb',
        frameworkUrl: 'Build/wordhex.framework.js.unityweb',
        codeUrl: 'Build/wordhex.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "DefaultCompany",
        productName: "WordHex",
        productVersion: "1.8",
        // Keep the integer-scaled portrait camera and HUD aligned while CSS fits the viewport.
        matchWebGLToCanvasSize: false,
        showBanner: (message, type) => {
          if (type === 'error') showError(message);
          else console.warn(message);
        }
      };
      const loader = document.createElement('script');
      loader.src = 'Build/wordhex.loader.js';
      loader.onerror = () => showError('Unable to load WordHex.');
      loader.onload = () => {
        createUnityInstance(canvas, config, value => { progress.value = value; })
          .then(() => { progress.hidden = true; })
          .catch(showError);
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
