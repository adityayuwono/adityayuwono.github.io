name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Stage the complete website
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.build-chunks/' --exclude='__pycache__/' --exclude='cozysushi/tools/' --exclude='cozysushi/HOSTING.md' --exclude='.gitignore' ./ "$RUNNER_TEMP/site/"
          python cozysushi/tools/package_webgl.py assemble --destination "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
